- type: entity
  parent: GasCanister
  id: TP14SeaWaterCanister
  name: sea water canister
  description: A canister that can contain any type of gas. This one is supposed to contain compressed sea water. It can be attached to connector ports using a wrench.
  components:
    - type: Sprite
      layers:
      - state: water_vapor
      - state: paper
        visible: false
        map: [ "enum.PaperLabelVisuals.Layer" ]
      - state: integrity-unshaded-0
        map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
        shader: unshaded
        visible: false
      - state: mask-water_vapor
        map: [ "enum.MaxPressureVisualLayers.Base" ]
        visible: false
    - type: MaxPressureVisuals
      integrityMask: mask-water_vapor
    - type: GasCanister
      air:
        volume: 1500
        moles:
          Water: 2769.36 # sea water
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger: &DamageContainerStrong
          !type:DamageTrigger
          damage: 140
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            TP14SeaWaterCanisterBroken:
              min: 1
              max: 1

- type: entity
  parent: GasCanisterBrokenBase
  id: TP14SeaWaterCanisterBroken
  name: broken sea water canister
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: water_vapor-1
